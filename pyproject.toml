[project]
name = "wahlwetter"
version = "0.1.0"
description = "Uncertainty-aware aggregation and Bayesian analysis of German election polls"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julian Gebert" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.optional-dependencies]
# Stan toolchain. Deliberately NOT installed by the lint/test CI job: compiling
# CmdStan is slow and only becomes relevant in Phase 3, which gets its own
# cached workflow.
model = ["cmdstanpy>=1.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.16",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wahlwetter"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/wahlwetter"]
branch = true
